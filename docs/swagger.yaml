        '403': { $ref: '#/components/responses/AcessoNegado' }
    put:
      tags: [Clínicas]
      summary: Atualiza clínica
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicaInput' }
      responses:
        '200':
          description: Clínica atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinica' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    delete:
      tags: [Clínicas]
      summary: Exclui clínica
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '204': { description: Clínica excluída }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }

  /api/v1/especialidades:
    get:
      tags: [Especialidades]
      summary: Lista especialidades
      responses:
        '200':
          description: Lista de especialidades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Especialidade' }
    post:
      tags: [Especialidades]
      summary: Cadastra especialidade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EspecialidadeInput' }
      responses:
        '201':
          description: Especialidade criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Especialidade' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
  /api/v1/especialidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Especialidades]
      summary: Busca especialidade por ID
      responses:
        '200':
          description: Especialidade encontrada
          content:
            application/json:
