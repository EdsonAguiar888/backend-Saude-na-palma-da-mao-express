openapi: 3.0.3
info:
  title: Saúde na Palma da Mão - API
  version: 1.0.0
  description: |
    Documentação da API do Projeto Integrador Saúde na Palma da Mão.
    Os endpoints refletem as rotas registradas em src/server.js.
servers:
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - name: Saúde
  - name: Autenticação
  - name: Usuários
  - name: Clínicas
  - name: Especialidades
  - name: Pacientes
  - name: Profissionais
  - name: Profissional-Clínica
  - name: Profissional-Especialidade
  - name: Clínica-Especialidade
  - name: Disponibilidades
  - name: Agendamentos
paths:
  /api/v1/health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está funcionando
      responses:
        '200':
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message:
                    {
                      type: string,
                      example: Backend Projeto_SPM API funcionando com sucesso!,
                    }

  /api/v1/auth/cadastro:
    post:
      tags: [Autenticação]
      summary: Cadastra uma conta de paciente
      description: A senha é armazenada como hash e o tipo de usuário é definido como PACIENTE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroInput' }
      responses:
        '201':
          description: Conta cadastrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioCadastrado' }
        '400': { $ref: '#/components/responses/ErroMensagemRequisicao' }
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroMensagem' }
        '500': { $ref: '#/components/responses/ErroInterno' }
  /api/v1/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário e retorna um JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ErroMensagemRequisicao' }
        '401':
          description: E-mail ou senha inválidos, ou usuário inativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroMensagem' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/v1/usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    post:
      tags: [Usuários]
      summary: Cadastra usuário
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioInput' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
  /api/v1/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      summary: Busca usuário por ID
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    put:
      tags: [Usuários]
      summary: Atualiza usuário
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioInput' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    delete:
      tags: [Usuários]
      summary: Exclui usuário
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '204': { description: Usuário excluído }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }

  /api/v1/clinicas:
    get:
      tags: [Clínicas]
      summary: Lista clínicas
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de clínicas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Clinica' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    post:
      tags: [Clínicas]
      summary: Cadastra clínica
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicaInput' }
      responses:
        '201':
          description: Clínica criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinica' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
  /api/v1/clinicas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clínicas]
      summary: Busca clínica por ID
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Clínica encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinica' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
