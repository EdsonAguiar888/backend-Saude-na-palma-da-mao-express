        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
    delete:
      tags: [Profissionais]
      summary: Exclui profissional
      description: Acesso restrito a administradores.
      security:
        - BearerAuth: []
      responses:
        '204': { description: Profissional excluído }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }

  /api/v1/profissional-clinica:
    get:
      tags: [Profissional-Clínica]
      summary: Lista vínculos entre profissionais e clínicas
      responses:
        '200':
          description: Lista de vínculos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfissionalClinica' }
    post:
      tags: [Profissional-Clínica]
      summary: Cria vínculo profissional-clínica
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfissionalClinicaInput' }
      responses:
        '201':
          description: Vínculo criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfissionalClinica' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
  /api/v1/profissional-clinica/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Profissional-Clínica]
      summary: Busca vínculo profissional-clínica por ID
      responses:
        '200':
          description: Vínculo encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfissionalClinica' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Profissional-Clínica]
      summary: Atualiza vínculo profissional-clínica
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfissionalClinicaInput' }
      responses:
        '200':
          description: Vínculo atualizado
