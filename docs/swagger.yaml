        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Especialidades]
      summary: Atualiza especialidade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EspecialidadeInput' }
      responses:
        '200':
          description: Especialidade atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Especialidade' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
    delete:
      tags: [Especialidades]
