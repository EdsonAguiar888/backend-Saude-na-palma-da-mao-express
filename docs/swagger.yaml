          description: Agendamento encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Agendamentos]
      summary: Atualiza agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoInput' }
      responses:
        '200':
          description: Agendamento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
    delete:
      tags: [Agendamentos]
      summary: Exclui agendamento
      responses:
        '204': { description: Agendamento excluído }
        '400': { $ref: '#/components/responses/ErroRequisicao' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador do registro
      schema:
        type: integer
        format: int64
  responses:
    ErroRequisicao:
      description: Erro na requisição
      content:
        application/json:
          schema:
            type: object
            properties:
              erro: { type: string, example: Mensagem do erro }
    NaoEncontrado:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              mensagem: { type: string, example: Registro não encontrado. }
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
    ErroMensagemRequisicao:
      description: Dados obrigatórios ausentes ou inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
    AcessoNegado:
      description: Acesso permitido somente para administradores
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
    ErroInterno:
      description: Erro interno ao processar a requisição
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroMensagem' }
  schemas:
    ErroMensagem:
      type: object
      properties:
        mensagem: { type: string, example: Mensagem de erro }
    CadastroInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, maxLength: 150, example: Maria da Silva }
        email:
          {
            type: string,
            format: email,
            maxLength: 150,
            example: maria@example.com,
          }
        senha:
          {
            type: string,
            format: password,
            writeOnly: true,
            example: SenhaForte123,
          }
        telefone:
          {
            type: string,
            maxLength: 20,
            nullable: true,
            example: '81999990000',
          }
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email, example: admin@admin.com }
        senha:
          {
            type: string,
            format: password,
            writeOnly: true,
            example: admin12345,
          }
    UsuarioCadastrado:
      type: object
      properties:
        id_usuario: { type: integer, format: int64, example: 1 }
        nome: { type: string, example: Maria da Silva }
        email: { type: string, format: email, example: maria@example.com }
        telefone: { type: string, nullable: true, example: '81999990000' }
        tipo_usuario: { type: string, enum: [PACIENTE], example: PACIENTE }
        ativo: { type: boolean, example: true }
        criado_em: { type: string, format: date-time }
    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token: { type: string, description: JWT para uso como Bearer token }
        usuario:
          type: object
          required: [id_usuario, nome, email, tipo_usuario]
          properties:
            id_usuario: { type: integer, format: int64, example: 1 }
            nome: { type: string, example: Maria da Silva }
            email: { type: string, format: email, example: maria@example.com }
            tipo_usuario:
              {
                type: string,
                enum: [PACIENTE, PROFISSIONAL, ADMINISTRADOR],
                example: PACIENTE,
              }
    UsuarioInput:
      type: object
      required: [nome, email, senha_hash, tipo_usuario]
      properties:
        nome: { type: string, maxLength: 150, example: Maria da Silva }
        email:
          {
            type: string,
            format: email,
            maxLength: 150,
            example: maria@example.com,
          }
        senha_hash:
          {
            type: string,
            writeOnly: true,
            maxLength: 255,
            description: Enviar o valor no formato esperado pelo backend; não enviar senha em texto puro sem confirmar a implementação de autenticação.,
          }
        telefone:
          {
            type: string,
            maxLength: 20,
            nullable: true,
            example: '81999990000',
          }
        tipo_usuario:
          { type: string, enum: [PACIENTE, PROFISSIONAL, ADMINISTRADOR] }
        ativo: { type: boolean, default: true }
    Usuario:
      allOf:
        - $ref: '#/components/schemas/UsuarioInput'
        - type: object
          properties:
            id_usuario: { type: integer, format: int64, readOnly: true }
            criado_em: { type: string, format: date-time, readOnly: true }
            senha_hash: { type: string, writeOnly: true }
    ClinicaInput:
      type: object
      required: [nome, cnpj]
      properties:
        nome: { type: string, maxLength: 150, example: Clínica Exemplo }
        cnpj: { type: string, maxLength: 18, example: '00.000.000/0001-00' }
        telefone: { type: string, maxLength: 20, nullable: true }
        email: { type: string, format: email, maxLength: 150, nullable: true }
        logradouro: { type: string, maxLength: 180, nullable: true }
        numero: { type: string, maxLength: 20, nullable: true }
        bairro: { type: string, maxLength: 100, nullable: true }
        cidade: { type: string, maxLength: 100, nullable: true }
        estado: { type: string, maxLength: 100, nullable: true }
        uf: { type: string, minLength: 2, maxLength: 2, nullable: true }
        ativo: { type: boolean, default: true }
    Clinica:
      allOf:
        - $ref: '#/components/schemas/ClinicaInput'
        - type: object
          properties:
            id_clinica: { type: integer, format: int64, readOnly: true }
    EspecialidadeInput:
      type: object
      required: [nome]
      properties:
        nome: { type: string, maxLength: 100, example: Ortopedia }
        descricao: { type: string, nullable: true }
        ativo: { type: boolean, default: true }
    Especialidade:
      allOf:
        - $ref: '#/components/schemas/EspecialidadeInput'
        - type: object
          properties:
            id_especialidade: { type: integer, format: int64, readOnly: true }
    PacienteInput:
      type: object
      required: [id_usuario, cpf, data_nascimento]
      properties:
        id_usuario: { type: integer, format: int64 }
        cpf: { type: string, maxLength: 14, example: '000.000.000-00' }
        data_nascimento: { type: string, format: date, example: '1960-05-20' }
        sexo: { type: string, maxLength: 30, nullable: true }
        observacoes: { type: string, nullable: true }
    Paciente:
      allOf:
        - $ref: '#/components/schemas/PacienteInput'
        - type: object
          properties:
            id_paciente: { type: integer, format: int64, readOnly: true }
            usuario: { $ref: '#/components/schemas/Usuario' }
    ProfissionalInput:
      type: object
      required: [id_usuario, cpf, conselho, registro_profissional, uf_registro]
      properties:
        id_usuario: { type: integer, format: int64 }
        cpf: { type: string, maxLength: 14 }
        conselho: { type: string, maxLength: 30, example: CREFITO }
        registro_profissional: { type: string, maxLength: 30 }
        uf_registro: { type: string, minLength: 2, maxLength: 2, example: PE }
        ativo: { type: boolean, default: true }
    Profissional:
      allOf:
        - $ref: '#/components/schemas/ProfissionalInput'
        - type: object
          properties:
            id_profissional: { type: integer, format: int64, readOnly: true }
            usuario: { $ref: '#/components/schemas/Usuario' }
    ProfissionalClinicaInput:
      type: object
      required: [id_profissional, id_clinica]
      properties:
        id_profissional: { type: integer, format: int64 }
        id_clinica: { type: integer, format: int64 }
        ativo: { type: boolean, default: true }
    ProfissionalClinica:
      allOf:
        - $ref: '#/components/schemas/ProfissionalClinicaInput'
        - type: object
          properties:
            id_profissional_clinica:
              { type: integer, format: int64, readOnly: true }
            profissional: { $ref: '#/components/schemas/Profissional' }
            clinica: { $ref: '#/components/schemas/Clinica' }
    ProfissionalEspecialidadeInput:
      type: object
      required: [id_profissional, id_especialidade]
      properties:
        id_profissional: { type: integer, format: int64 }
        id_especialidade: { type: integer, format: int64 }
    ProfissionalEspecialidade:
      allOf:
        - $ref: '#/components/schemas/ProfissionalEspecialidadeInput'
        - type: object
          properties:
            profissional: { $ref: '#/components/schemas/Profissional' }
            especialidade: { $ref: '#/components/schemas/Especialidade' }
    ClinicaEspecialidadeInput:
      type: object
      required: [id_clinica, id_especialidade]
      properties:
        id_clinica: { type: integer, format: int64 }
        id_especialidade: { type: integer, format: int64 }
    ClinicaEspecialidade:
      allOf:
        - $ref: '#/components/schemas/ClinicaEspecialidadeInput'
        - type: object
          properties:
            clinica: { $ref: '#/components/schemas/Clinica' }
            especialidade: { $ref: '#/components/schemas/Especialidade' }
    DisponibilidadeInput:
      type: object
      required:
        [
          id_profissional_clinica,
          data_atendimento,
          hora_inicio,
          hora_fim,
          duracao_minutos,
          status,
        ]
      properties:
        id_profissional_clinica: { type: integer, format: int64 }
        data_atendimento: { type: string, format: date, example: '2026-11-10' }
        hora_inicio: { type: string, example: '09:00:00' }
        hora_fim: { type: string, example: '09:30:00' }
        duracao_minutos: { type: integer, example: 30 }
        status: { type: string, enum: [DISPONIVEL, RESERVADO, BLOQUEADO] }
    Disponibilidade:
      allOf:
        - $ref: '#/components/schemas/DisponibilidadeInput'
        - type: object
          properties:
            id_disponibilidade: { type: integer, format: int64, readOnly: true }
            profissionalClinica:
              { $ref: '#/components/schemas/ProfissionalClinica' }
    AgendamentoInput:
      type: object
      required:
        [
          id_paciente,
          id_profissional_clinica,
          id_especialidade,
          data_hora,
          status,
        ]
      properties:
        id_paciente: { type: integer, format: int64 }
        id_profissional_clinica: { type: integer, format: int64 }
        id_especialidade: { type: integer, format: int64 }
        data_hora:
          { type: string, format: date-time, example: '2026-11-10T09:00:00' }
        status:
          { type: string, enum: [PENDENTE, CONFIRMADO, CANCELADO, CONCLUIDO] }
        observacao: { type: string, nullable: true }
    Agendamento:
      allOf:
        - $ref: '#/components/schemas/AgendamentoInput'
        - type: object
          properties:
            id_agendamento: { type: integer, format: int64, readOnly: true }
            criado_em: { type: string, format: date-time, readOnly: true }
            paciente: { $ref: '#/components/schemas/Paciente' }
            profissionalClinica:
              { $ref: '#/components/schemas/ProfissionalClinica' }
            especialidade: { $ref: '#/components/schemas/Especialidade' }
