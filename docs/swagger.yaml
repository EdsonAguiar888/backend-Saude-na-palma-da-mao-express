        '400': { $ref: '#/components/responses/ErroRequisicao' }
  /api/v1/disponibilidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Disponibilidades]
      summary: Busca disponibilidade por ID
      responses:
