      responses:
        '201':
          description: Profissional criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profissional' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/AcessoNegado' }
  /api/v1/profissionais/{id}:
    parameters:
