  /api/v1/agendamentos:
    get:
      tags: [Agendamentos]
      summary: Lista agendamentos
      responses:
        '200':
          description: Lista de agendamentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agendamento' }
    post:
      tags: [Agendamentos]
      summary: Cria agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoInput' }
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
  /api/v1/agendamentos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Agendamentos]
      summary: Busca agendamento por ID
      responses:
