  /api/v1/profissional-especialidade:
    get:
      tags: [Profissional-Especialidade]
      summary: Lista associações entre profissionais e especialidades
      responses:
        '200':
          description: Lista de associações
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: '#/components/schemas/ProfissionalEspecialidade' }
    post:
      tags: [Profissional-Especialidade]
      summary: Cria associação profissional-especialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/ProfissionalEspecialidadeInput' }
      responses:
        '201':
          description: Associação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfissionalEspecialidade' }
        '400': { $ref: '#/components/responses/ErroRequisicao' }
  /api/v1/profissional-especialidade/{idProfissional}/{idEspecialidade}:
    parameters:
      - name: idProfissional
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: idEspecialidade
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Profissional-Especialidade]
      summary: Busca associação por chave composta
      responses:
        '200':
          description: Associação encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfissionalEspecialidade' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Profissional-Especialidade]
      summary: Exclui associação por chave composta
      responses:
        '204': { description: Associação excluída }
        '400': { $ref: '#/components/responses/ErroRequisicao' }

  /api/v1/clinica-especialidade:
